############################################################
# AQTIP
# Adaptive Quantitative Trading Intelligence Platform
#
# Central Development Configuration
#
# This file defines how the project is tested,
# validated and measured.
#
# Philosophy:
# Quality should be automated whenever possible.
############################################################


############################################################
# Pytest Configuration
############################################################

[tool.pytest.ini_options]

minversion = "8.0"

testpaths = [
    "tests"
]

pythonpath = [
    "src"
]

addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short"
]


############################################################
# Coverage Configuration
############################################################

[tool.coverage.run]

source = [
    "src"
]

branch = true

omit = [
    "*/__init__.py"
]


############################################################
# Coverage Report
############################################################

[tool.coverage.report]

show_missing = true

skip_covered = false

precision = 2


