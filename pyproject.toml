[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aqtip"
version = "0.1.0"
description = "Adaptive Quantitative Trading Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    {name = "Tony Ochieng"}
]

dependencies = [
    "python-binance",
    "pandas",
    "pyyaml",
    "pyarrow"
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]