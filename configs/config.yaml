############################################################
# AQTIP Configuration
############################################################

application:
  name: AQTIP
  version: 0.1.0
  environment: development

market:
  exchange: binance
  symbol: BTCUSDT
  interval: 1h
  limit: 1000

storage:
  data_directory: data
  format: parquet

logging:
  level: INFO
  file: logs/aqtip.log

backtest:
  initial_capital: 10000
  leverage: 10